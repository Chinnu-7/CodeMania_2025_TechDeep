<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVASAFE</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #170f43;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: #ffffff;
            animation: fadeIn 2s ease-in-out;
        }

        .animation-container {
            width: 150px;
            height: 150px;
            margin: 20px auto;
        }

        .animation-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: pulse 2s infinite;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        p {
            font-size: 1.2rem;
            color: #ffffff;
            animation: slideIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EVASAFE</h1>
        <div class="animation-container">
            <a href="log.html"><img src="women.jpg" alt="Women Safety">
            </a>
            </div>
        <p>Empowering women, ensuring safety, spreading awareness.</p>
    </div>
    
</body>
</html>
